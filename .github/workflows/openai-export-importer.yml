name: OpenAI export importer regression
on:
  pull_request:
    paths:
      - 'src/cobble/openai_export.py'
      - 'scripts/import_openai_export.py'
      - 'tests/test_openai_export.py'
      - '.github/workflows/openai-export-importer.yml'
  push:
    branches: [main]
    paths:
      - 'src/cobble/openai_export.py'
      - 'scripts/import_openai_export.py'
      - 'tests/test_openai_export.py'
      - '.github/workflows/openai-export-importer.yml'
jobs:
  private-free-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic fixtures only; no personal export or credentials
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_openai_export.py' -v
