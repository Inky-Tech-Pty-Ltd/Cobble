name: Cobble experimental memory graph tests
on:
  push:
    branches:
      - experiment/evidence-aware-memory-graph
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/memory-graph-tests.yml"
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Cobble
        uses: actions/checkout@v4
        with:
          path: Cobble
      - name: Check out VillageLink prototype
        uses: actions/checkout@v4
        with:
          repository: Inky-Tech-Pty-Ltd/VillageLink
          path: VillageLink
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit suite
        working-directory: Cobble
        run: PYTHONPATH=src:../VillageLink/prototype python -m unittest discover -s tests -v
      - name: Run synthetic A0 A1 A2 evaluation
        working-directory: Cobble
        run: PYTHONPATH=src:../VillageLink/prototype python scripts/evaluate_memory_graph.py
      - name: Run independent adversarial retrieval benchmark
        working-directory: Cobble
        run: python scripts/evaluate_independent_benchmark.py
      - name: Run Star Credential representation ablation
        working-directory: Cobble
        run: PYTHONPATH=src:../VillageLink/prototype python scripts/evaluate_star_ablation.py
