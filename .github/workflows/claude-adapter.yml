name: Claude adapter offline regression
on:
  pull_request:
    paths:
      - 'src/cobble/claude_adapter.py'
      - 'src/cobble/snug_exchange.py'
      - 'scripts/preview_claude.py'
      - 'tests/test_claude_adapter.py'
      - '.github/workflows/claude-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'src/cobble/claude_adapter.py'
      - 'src/cobble/snug_exchange.py'
      - 'scripts/preview_claude.py'
      - 'tests/test_claude_adapter.py'
      - '.github/workflows/claude-adapter.yml'
jobs:
  synthetic-offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No credential or network is supplied to provider tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_claude_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_snug_exchange.py' -v
