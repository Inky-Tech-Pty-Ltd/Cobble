name: Mistral adapter offline regression
on:
  pull_request:
    paths:
      - 'src/cobble/mistral_adapter.py'
      - 'src/cobble/snug_exchange.py'
      - 'tests/test_mistral_adapter.py'
      - 'tests/test_claude_adapter.py'
      - '.github/workflows/mistral-adapter.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test provider safety and exchange without network
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_mistral_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_claude_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_snug_exchange.py' -v
