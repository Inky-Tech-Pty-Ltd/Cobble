name: OpenAI third supplier offline regression
on:
  pull_request:
    paths:
      - 'src/cobble/openai_adapter.py'
      - 'src/cobble/snug_exchange.py'
      - 'tests/test_openai_adapter.py'
      - '.github/workflows/openai-adapter.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keyless no-network regression
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_openai_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_claude_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_mistral_adapter.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_snug_exchange.py' -v
