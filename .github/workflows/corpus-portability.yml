name: Corpus portability tests

on:
  pull_request:
    paths:
      - 'src/cobble/portability.py'
      - 'scripts/portable_github_corpus.py'
      - 'tests/test_portability.py'
      - 'docs/corpus-portability-experiment.md'
      - '.github/workflows/corpus-portability.yml'
      - 'scripts/verify_public_corpus_roundtrip.py'
  push:
    paths:
      - 'src/cobble/portability.py'
      - 'scripts/portable_github_corpus.py'
      - 'tests/test_portability.py'
      - '.github/workflows/corpus-portability.yml'

jobs:
  portability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check out VillageLink prototype dependency
        uses: actions/checkout@v4
        with:
          repository: Inky-Tech-Pty-Ltd/VillageLink
          path: vendor/VillageLink
          persist-credentials: false
      - name: Verify Cobble unittest suite
        run: PYTHONPATH=src:vendor/VillageLink/prototype python -m unittest discover -s tests -v

  live-public-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate, ingest, restore and compare public archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/verify_public_corpus_roundtrip.py
